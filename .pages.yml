# Editing dashboard config for Pages CMS (https://app.pagescms.org)
# Sign in there with GitHub, pick this repository, and you get forms for everything below.

media:
  input: src/images
  output: /images
  extensions: [jpg, jpeg, png, webp, gif, svg]

content:
  - name: projects
    label: Projects
    type: collection
    path: src/projects
    format: json
    filename: "{primary}.json"
    view:
      primary: title
      fields: [title, year, order]
      sort: [order, year, title]
      default:
        sort: order
        order: asc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: year
        label: Year
        type: number
        required: true
      - name: order
        label: Position on the homepage
        description: Lower numbers show first. Existing projects use 10, 20, 30… so you can slot a new one in between (e.g. 15). Leave at 0 to put it first.
        type: number
        default: 0
      - name: featured
        label: Show in the homepage slideshow
        type: boolean
        default: false
      - name: hidden
        label: Hide this project
        description: Keeps it saved but takes it off the site.
        type: boolean
        default: false
      - name: category
        label: Discipline
        description: For example Product, Furniture, Lighting, Graphic Design
        type: string
      - name: tools
        label: Tools
        description: For example Rhino, Grasshopper, Blender
        type: string
      - name: cover
        label: Cover image
        description: Used on the homepage grid and at the top of the project page. Landscape works best. Export as JPG, about 2000px wide.
        type: image
        required: true
      - name: description
        label: Description
        description: Leave a blank line between paragraphs. The first paragraph is shown larger.
        type: text
      - name: section
        label: Homepage section
        description: Projects are grouped on the homepage by this name, e.g. "Product launches" or "Design work". Leave empty for Design work.
        type: string
      - name: company
        label: Company
        type: string
      - name: role
        label: Your role
        type: string
      - name: status
        label: Status
        description: For example "Launched, April 2025" or "Gate 3 complete".
        type: string
      - name: metrics
        label: Key numbers
        description: Large figures under the description. Four works best. Optional.
        type: object
        list: true
        fields:
          - name: value
            label: Number
            type: string
          - name: label
            label: What it means
            type: string
      - name: brief
        label: Overview
        description: Short labeled points such as Problem, Solution, Customers, Competition. Optional.
        type: object
        list: true
        fields:
          - name: label
            label: Label
            type: string
          - name: text
            label: Text
            type: text
      - name: gates
        label: Stage-gate progress
        description: One entry per gate (G0 to G5). Tick "Complete" for gates passed. Optional.
        type: object
        list: true
        fields:
          - name: gate
            label: Gate
            type: select
            options:
              values: [G0, G1, G2, G3, G4, G5]
          - name: date
            label: Date
            type: string
          - name: label
            label: Name (optional)
            description: Defaults to Concept, Define, Develop, Validate, Launch, Post-launch.
            type: string
          - name: done
            label: Complete
            type: boolean
      - name: research_intro
        label: Research introduction
        type: text
      - name: charts
        label: Research charts
        description: Optional. Keep confidential figures out; percentages and indexes work well.
        type: object
        list: true
        fields:
          - name: type
            label: Chart type
            type: select
            options:
              values:
                - { value: hbar, label: "Horizontal bars" }
                - { value: bar, label: "Vertical bars" }
                - { value: line, label: "Line" }
                - { value: split, label: "Share of a whole (100% bar)" }
                - { value: stack, label: "Survey rows (stacked 100% bars)" }
                - { value: table, label: "Table" }
                - { value: words, label: "Word cloud" }
          - name: title
            label: Title
            type: string
          - name: caption
            label: Caption
            type: text
          - name: labels
            label: Labels
            description: One per line (categories, years, or survey questions).
            type: text
          - name: series
            label: Data series
            description: Values separated by commas, in the same order as the labels. Leave a value blank for a gap.
            type: object
            list: true
            fields:
              - name: name
                label: Series name
                type: string
              - name: values
                label: Values
                type: string
              - name: highlight
                label: Highlight in orange
                type: boolean
              - name: dashed
                label: Dashed line (line charts)
                type: boolean
          - name: highlight
            label: Highlight labels
            description: Labels to show in orange, one per line.
            type: text
          - name: prefix
            label: Value prefix (e.g. $)
            type: string
          - name: suffix
            label: Value suffix (e.g. %)
            type: string
          - name: decimals
            label: Decimal places
            type: number
          - name: columns
            label: Table columns
            description: Tables only. Separate columns with |
            type: string
          - name: rows
            label: Table rows
            description: Tables only. One row per line, columns separated by |
            type: text
          - name: show_values
            label: Show values on line points
            type: boolean
            default: true
          - name: wide
            label: Full width
            type: boolean
          - name: note
            label: Footnote
            type: string
      - name: my_role
        label: My role (paragraphs)
        type: text
      - name: stakeholders
        label: Stakeholders
        type: object
        list: true
        fields:
          - name: group
            label: Group
            type: string
          - name: members
            label: Who (one per line)
            type: text
      - name: recovery_title
        label: Win-back plan heading
        type: string
      - name: recovery_intro
        label: Win-back plan intro
        type: text
      - name: recovery
        label: Win-back plan steps
        type: object
        list: true
        fields:
          - name: label
            label: Step
            type: string
          - name: text
            label: Detail
            type: text
      - name: challenges
        label: Challenges and resolutions
        type: object
        list: true
        fields:
          - name: challenge
            label: Challenge
            type: text
          - name: resolution
            label: Resolution
            type: text
      - name: quotes
        label: Customer quotes
        type: object
        list: true
        fields:
          - name: quote
            label: Quote
            type: text
          - name: source
            label: Who said it
            type: string
      - name: swot
        label: SWOT analysis
        type: object
        fields:
          - name: strengths
            label: Strengths (one per line)
            type: text
          - name: weaknesses
            label: Weaknesses (one per line)
            type: text
          - name: opportunities
            label: Opportunities (one per line)
            type: text
          - name: threats
            label: Threats (one per line)
            type: text
      - name: images
        label: Project images
        description: Shown in this order. Drag to reorder. Export as JPG, about 2400px on the long side, so pages load fast.
        type: image
        list: true

  - name: site
    label: Site text, About and contact
    type: file
    path: src/site.json
    format: json
    fields:
      - name: name
        label: Your name
        type: string
      - name: role
        label: Title
        description: Shown in the header and as the big About heading.
        type: string
      - name: tagline
        label: Tagline
        description: Shown under your name on the homepage.
        type: string
      - name: email
        label: Contact email
        type: string
      - name: location
        label: Location
        type: string
      - name: linkedin
        label: LinkedIn link
        type: string
      - name: instagram
        label: Instagram link
        type: string
      - name: contact_line
        label: Footer line above your email
        type: string
      - name: about
        label: About text
        description: Leave a blank line between paragraphs. The first paragraph is shown larger.
        type: text
      - name: stats
        label: Key numbers
        description: Shown as large figures near the top of the About page. Four works best.
        type: object
        list: true
        fields:
          - name: value
            label: Number
            type: string
          - name: label
            label: What it means
            type: string
      - name: experience
        label: Experience
        description: Newest first. Drag to reorder.
        type: object
        list: true
        fields:
          - name: company
            label: Company
            type: string
          - name: role
            label: Role
            type: string
          - name: dates
            label: Dates
            type: string
          - name: summary
            label: Summary
            type: text
      - name: capabilities
        label: Capabilities
        type: object
        list: true
        fields:
          - name: title
            label: Group name
            type: string
          - name: items
            label: Items
            description: One per line.
            type: text
      - name: education
        label: Education
        description: One per line.
        type: text
      - name: recognition
        label: Recognition and teaching
        description: One per line.
        type: text
      - name: languages
        label: Languages
        description: One per line.
        type: text
      - name: collaborations
        label: Brands and collaborations
        description: One per line.
        type: text
